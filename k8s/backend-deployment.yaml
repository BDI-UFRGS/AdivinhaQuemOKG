apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.36.0 (HEAD)
  labels:
    io.kompose.service: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backend
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.36.0 (HEAD)
      labels:
        io.kompose.service: backend
    spec:
      containers:
        - env:
            - name: NEO4J_ENTITY_LABEL
              value: Pessoa
            - name: NEO4J_PASSWORD
            - name: NEO4J_URI
            - name: NEO4J_USER
            - name: PORT
              value: "3000"
          image: backend
          name: backend
          ports:
            - containerPort: 3000
              protocol: TCP
      restartPolicy: Always
