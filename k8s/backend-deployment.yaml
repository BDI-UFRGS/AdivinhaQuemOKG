apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f ../docker-compose.yml
    kompose.version: 1.36.0 (HEAD)
  labels:
    io.kompose.service: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backend
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f ../docker-compose.yml
        kompose.version: 1.36.0 (HEAD)
      labels:
        io.kompose.service: backend
    spec:
      containers:
        - env:
            - name: NEO4J_ENTITY_LABEL
              value: Pessoa
            - name: NEO4J_PASSWORD
              value: okgpassw
            - name: NEO4J_URI
              value: neo4j
            - name: NEO4J_USER
              value: neo4j
            - name: PORT
              value: "3000"
          image: ghcr.io/bdi-ufrgs/adivinhaquem-backend:0.1
          name: backend
          ports:
            - containerPort: 3000
              protocol: TCP
      restartPolicy: Always
